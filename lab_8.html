<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Anton Berehiy">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Animation</title>
    <style>
        canvas {
            border: 2px solid black;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<canvas id="myCanvas" width="500" height="400"></canvas>

<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    // Анімовані фігури
    const shapes = [
        {type: 'circle', x: 375, y: 225, radius: 25, dx: 2, dy: 2, color: 'blue'},
        {type: 'rectangle', x: 150, y: 50, width: 50, height: 50, dx: 3, dy: 2, color: 'green'},
        {type: 'triangle', x: 300, y: 150, dx: -2, dy: -2, color: 'red'}
    ];

    // Функція малювання статичних фігур
    function drawStaticShapes() {
        // Прямокутники
        ctx.fillStyle = 'blue';
        ctx.fillRect(400, 50, 50, 50);
        ctx.strokeStyle = 'black'; // Темна межа
        ctx.strokeRect(400, 50, 50, 50);
        
        ctx.fillRect(400, 200, 50, 50);
        ctx.strokeRect(400, 200, 50, 50);
        
        ctx.fillRect(150, 200, 50, 50);
        ctx.strokeRect(150, 200, 50, 50);
        
        ctx.fillRect(350, 150, 50, 50);
        ctx.strokeRect(350, 150, 50, 50);
        
        ctx.fillRect(200, 150, 50, 50);
        ctx.strokeRect(200, 150, 50, 50);

        // Кола
        ctx.fillStyle = 'blue';
        ctx.beginPath();
        ctx.arc(250, 100, 50, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'black'; // Темна межа
        ctx.stroke();

        ctx.fillStyle = 'blue';
        ctx.beginPath();
        ctx.arc(350, 100, 50, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Лінії та стрілки
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 150);
        ctx.lineTo(440, 150);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(150, 300);
        ctx.lineTo(150, 20);
        ctx.stroke();

        // Ділення та текст на осі
        ctx.font = '12px Arial';
        const marks = [-2, -1, 1, 2, 3, 4, 5];
        marks.forEach((mark, index) => {
            ctx.beginPath();
            ctx.moveTo(50 + index * 50, 135);
            ctx.lineTo(50 + index * 50, 165);
            ctx.stroke();
            ctx.fillText(mark, 35 + index * 50, 170);
        });

        ctx.fillText('X', 440, 180);
        ctx.fillText('Y', 170, 20);
    }

    // Функція малювання анімованих фігур
    function drawShapes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawStaticShapes(); // Малюємо статичні фігури
        shapes.forEach(shape => {
            ctx.fillStyle = shape.color;
            ctx.strokeStyle = 'black'; // Темна межа
            ctx.lineWidth = 2; // Ширина межі
            if (shape.type === 'circle') {
                ctx.beginPath();
                ctx.arc(shape.x, shape.y, shape.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke(); // Малюємо межу
            } else if (shape.type === 'rectangle') {
                ctx.fillRect(shape.x, shape.y, shape.width, shape.height);
                ctx.strokeRect(shape.x, shape.y, shape.width, shape.height); // Малюємо межу
            } else if (shape.type === 'triangle') {
                ctx.beginPath();
                ctx.moveTo(shape.x, shape.y);
                ctx.lineTo(shape.x - 50, shape.y + 100);
                ctx.lineTo(shape.x + 50, shape.y + 100);
                ctx.closePath();
                ctx.fill();
                ctx.stroke(); // Малюємо межу
            }
        });
    }

    // Анімація фігур
    function animateShapes() {
        shapes.forEach(shape => {
            shape.x += shape.dx;
            shape.y += shape.dy;

            // Відбивання від стінок
            if (shape.type === 'circle') {
                if (shape.x + shape.radius > canvas.width || shape.x - shape.radius < 0) {
                    shape.dx *= -1;
                }
                if (shape.y + shape.radius > canvas.height || shape.y - shape.radius < 0) {
                    shape.dy *= -1;
                }
            } else if (shape.type === 'rectangle') {
                if (shape.x + shape.width > canvas.width || shape.x < 0) {
                    shape.dx *= -1;
                }
                if (shape.y + shape.height > canvas.height || shape.y < 0) {
                    shape.dy *= -1;
                }
            } else if (shape.type === 'triangle') {
                // Перевірка на відбивання трикутника
                if (shape.x + 50 > canvas.width || shape.x - 50 < 0) {
                    shape.dx *= -1;
                }
                if (shape.y + 100 > canvas.height || shape.y < 0) {
                    shape.dy *= -1;
                }
            }
        });
        drawShapes();
        requestAnimationFrame(animateShapes);
    }

    // Запускаємо анімацію при кліку
    canvas.addEventListener("click", () => {
        animateShapes();
    });

    drawShapes(); // Початкове малювання
</script>

</body>
</html>
