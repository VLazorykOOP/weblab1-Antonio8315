<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Library</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .form-container {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .media-section {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Menu for Library Navigation -->
    <form action="#" class="form-container">
        <legend>Library Menu</legend>
        <div class="input-group">
            <label for="search">Search:</label>
            <input type="text" id="search" name="search" placeholder="Search media...">
        </div>
        <div class="input-group">
            <label for="category">Category:</label>
            <select id="category" name="category">
                <option value="all">All</option>
                <option value="audio">Audio</option>
                <option value="video">Video</option>
            </select>
        </div>
        <div class="input-group">
            <button type="submit">Search</button>
        </div>
    </form>

    <!-- Media Content -->
    <div class="media-section">
        <h2>Media Library</h2>
        
        <!-- Audio Example -->
        <h3>Audio Track</h3>
        <audio controls>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            <source src="https://www.bensound.com/bensound-music/bensound-creativeminds.ogg" type="audio/ogg">
            Your browser does not support the audio element.
        </audio>
        
        <!-- Video Example -->
        <h3>Video Clip</h3>
        <video width="320" height="240" controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            <source src="https://www.learningcontainer.com/wp-content/uploads/2020/05/sample-webm-file.webm" type="video/webm">
            Your browser does not support the video element.
        </video>
    </div>

</body>
</html>
